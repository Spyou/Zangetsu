org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=128m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# --- Build speed ---
# Run independent module tasks in parallel, reuse build outputs across builds,
# and keep the Gradle daemon warm between runs.
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=true
org.gradle.daemon=true
# Configure-on-demand must stay OFF. build.gradle.kts retargets every
# subproject's build directory; when this is on, a plugin module can be
# configured before that retarget applies, so one task writes its
# intermediates to the old path and the next reads the new one. It surfaces
# as "R-def.txt which doesn't exist" on a random plugin and survives a clean,
# because the config is rebuilt broken every time. Whether it hits you depends
# on daemon state and parallelism, so it looks machine-specific. It is not.
# AGP does not support configure-on-demand and Gradle is deprecating it.
org.gradle.configureondemand=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# Several transitive Flutter plugins still publish Java 11/Kotlin 1.8 build
# tasks while the app targets JVM 17. AGP 9 rejects that legacy mismatch before
# compilation; keep it as a warning until those plugins migrate.
kotlin.jvm.target.validation.mode=warning

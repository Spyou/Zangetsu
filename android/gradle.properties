org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# --- Build speed ---
# Run independent module tasks in parallel, reuse build outputs across builds,
# and keep the Gradle daemon warm between runs.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true
# Configure-on-demand must stay OFF. build.gradle.kts retargets every
# subproject's build directory; when this is on, a plugin module can be
# configured before that retarget applies, so one task writes its
# intermediates to the old path and the next reads the new one. It surfaces
# as "R-def.txt which doesn't exist" on a random plugin and survives a clean,
# because the config is rebuilt broken every time. Whether it hits you depends
# on daemon state and parallelism, so it looks machine-specific. It is not.
# AGP does not support configure-on-demand and Gradle is deprecating it.
org.gradle.configureondemand=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

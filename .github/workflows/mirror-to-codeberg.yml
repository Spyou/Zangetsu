name: Mirror to Codeberg

on:
  push:
    branches:
      - "**"
    tags:
      - "**"
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

concurrency:
  group: mirror-to-codeberg
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mirror:
    if: github.repository == 'Spyou/Zangetsu'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Configure credentials via .netrc
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CB_USER: ${{ secrets.CODEBERG_USER }}
          CB_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          set -euo pipefail
          cat > "${HOME}/.netrc" <<EOF
          machine github.com
          login x-access-token
          password ${GH_TOKEN}

          machine codeberg.org
          login ${CB_USER}
          password ${CB_TOKEN}
          EOF
          chmod 600 "${HOME}/.netrc"

      - name: Clone full mirror from GitHub
        run: |
          set -euo pipefail
          git clone --mirror "https://github.com/${GITHUB_REPOSITORY}.git" repo-mirror

      - name: Sanity-check the mirror before pushing
        run: |
          set -euo pipefail
          cd repo-mirror
          branch_count=$(git branch -a | wc -l)
          tag_count=$(git tag | wc -l)
          echo "Fetched ${branch_count} branches and ${tag_count} tags."
          if [ "${branch_count}" -eq 0 ]; then
            echo "::error::Mirror clone produced 0 branches — aborting to avoid wiping Codeberg."
            exit 1
          fi

      - name: Push full mirror to Codeberg (with retry)
        env:
          CB_USER: ${{ secrets.CODEBERG_USER }}
          CB_REPO: ${{ secrets.CODEBERG_REPO }}
        run: |
          set -euo pipefail
          cd repo-mirror
          git remote set-url origin "https://codeberg.org/${CB_USER}/${CB_REPO}.git"

          # Drop GitHub's per-PR refs before pushing. `git clone --mirror` pulls
          # down refs/pull/*, which Codeberg refuses ("deny updating a hidden
          # ref") because Forgejo owns that namespace itself. The branches and
          # tags still pushed fine, but git exits non-zero on the partial
          # rejection, so the whole job went red from the day the first PR was
          # opened. Nothing downstream needs these mirrored.
          git for-each-ref --format='delete %(refname)' refs/pull | git update-ref --stdin

          attempt=1
          max_attempts=3
          until git push --mirror origin; do
            if [ "${attempt}" -ge "${max_attempts}" ]; then
              echo "::error::Push to Codeberg failed after ${max_attempts} attempts."
              exit 1
            fi
            echo "Push attempt ${attempt} failed, retrying in 10s..."
            attempt=$((attempt + 1))
            sleep 10
          done

      - name: Clean up credentials
        if: always()
        run: rm -f "${HOME}/.netrc"

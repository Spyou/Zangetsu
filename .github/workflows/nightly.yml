name: Nightly debug build

on:
  schedule:
    # 08:30 UTC = 2:00pm IST (GitHub cron is always UTC).
    - cron: "30 8 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-debug
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.7"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zangetsu-nightly
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

db-uri = "user=sync_authenticator dbname=zangetsu_sync_stage host=/var/run/postgresql"
db-schemas = "sync_api"
db-extra-search-path = ""
jwt-secret = "@/etc/zangetsu-sync/jwks.json"
jwt-aud = "authenticated"
# Apply sql/015_auth_issuer.sql before enabling this hook.
db-pre-request = "sync_private.verify_auth_issuer"
server-host = "127.0.0.1"
server-port = 3000
